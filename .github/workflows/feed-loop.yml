name: MP feed loop

# Keeps news and video coming in on a steady beat. Every 15 minutes it asks
# mymp.bd to run one collector: news feeds and outlet sitemaps take turns, and
# YouTube runs once an hour (src/lib/feed/collect.ts, collectors.ts).
#
# Why a loop instead of a schedule per collector: GitHub fired the old
# half-hourly schedules only every three to six hours, so the feed went stale
# for most of the day. One run of this workflow keeps going for almost six
# hours, then starts its own successor. The schedule below is only a backstop
# that revives the chain if it ever breaks; when a loop is already running, the
# backstop run exits at once.
#
# The job turns red, and GitHub emails the owner, only when two whole rounds in
# a row failed, which means the site itself is down. A single blocked outlet or
# a slow collector is written to the feed_runs table and shown in /admin.
#
# Needs the repository secret MYMP_CRON_SECRET, the same value as CRON_SECRET
# in Vercel. The repository is public, so the runner time costs nothing.

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      handover:
        description: 'Started by the previous loop (skips the already-running check)'
        required: false
        default: 'false'

permissions:
  actions: write
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip when a loop is already running
        id: check
        run: |
          if [ "${{ inputs.handover }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          others=$(gh run list --workflow feed-loop.yml --limit 20 --json databaseId,status \
            --jq "map(select(.databaseId != ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\"))) | length")
          echo "other loops running: $others"
          if [ "$others" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect news and video
        if: steps.check.outputs.run == 'true'
        env:
          CRON_SECRET: ${{ secrets.MYMP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The MYMP_CRON_SECRET repository secret is not set."; exit 1; fi
          call() {
            code=$(curl -sS -o result.json -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://mymp.bd/api/cron/feed?collector=$1&trigger=github" || true)
            echo "$(date -u +%H:%M) $1 -> $code $(head -c 300 result.json 2>/dev/null)"
            test "$code" = "200"
          }
          began=$(date +%s)
          slot=0
          bad_rounds=0
          # Stop after 5h40m, leaving time to hand over inside the 6-hour job limit.
          while [ $(( $(date +%s) - began )) -lt 20400 ]; do
            started=$(date +%s)
            ok=0; tried=0
            if [ $((slot % 2)) -eq 0 ]; then
              tried=$((tried+1)); call rss && ok=$((ok+1))
            else
              tried=$((tried+1)); call sitemap && ok=$((ok+1))
            fi
            if [ $((slot % 4)) -eq 1 ]; then
              tried=$((tried+1)); call youtube && ok=$((ok+1))
            fi
            if [ "$ok" -eq 0 ]; then bad_rounds=$((bad_rounds+1)); else bad_rounds=0; fi
            if [ "$bad_rounds" -ge 2 ]; then echo "Two rounds in a row failed: mymp.bd is not answering."; failed=1; fi
            slot=$((slot+1))
            wait_for=$(( 900 - ($(date +%s) - started) ))
            [ "$wait_for" -gt 0 ] && sleep "$wait_for"
          done
          [ -z "$failed" ]

      - name: Start the next loop
        if: ${{ !cancelled() && steps.check.outputs.run == 'true' }}
        run: gh workflow run feed-loop.yml --ref main -f handover=true
