name: Sangsad worker

# MYMP_DEPLOY_TOKEN must be a fine-grained token with Contents: Read and write
# on this repository; it is used only to request the VPS deployment workflow.
# Nightly refresh of the সংসদ engine behind mymp.bd from parliament.gov.bd,
# and on demand. Runs the parliament jobs in order; each job records itself
# in ingest_runs. Reads the repository secrets SANGSAD_DATABASE_URL,
# SANGSAD_SUPABASE_URL and SANGSAD_SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 20 * * *' # 02:00 Dhaka
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (parliament, parliament:photos, parliament:report, og:cards, health)'
        default: parliament
        required: true

defaults:
  run:
    working-directory: sangsad

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.SANGSAD_DATABASE_URL }}
      DATABASE_SSL: disable
      DATABASE_SCHEMA: sangsad
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SANGSAD_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANGSAD_SUPABASE_SERVICE_ROLE_KEY }}
      APP_ENV: production
      # GitHub token used to start the VPS deployment after fresh data is published.
      MYMP_DEPLOY_TOKEN: ${{ secrets.MYMP_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sangsad/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate database URL
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.DATABASE_URL?.trim();
          if (!value) throw new Error('SANGSAD_DATABASE_URL is empty');
          if (/^["']|["']$/.test(value) || /\s/.test(value)) {
            throw new Error('SANGSAD_DATABASE_URL must be an unquoted URL without whitespace');
          }
          const parsed = new URL(value);
          if (!['postgres:', 'postgresql:'].includes(parsed.protocol) || !parsed.hostname || !parsed.pathname) {
            throw new Error('SANGSAD_DATABASE_URL must be a complete postgresql:// URL');
          }
          console.log(`database URL format valid (host: ${parsed.hostname}, port: ${parsed.port || 'default'})`);
          NODE
      - name: Run on demand
        if: github.event_name == 'workflow_dispatch'
        run: pnpm worker ${{ github.event.inputs.job }}
      - name: Nightly refresh
        if: github.event_name == 'schedule'
        run: |
          pnpm worker parliament
          pnpm worker parliament:photos
          pnpm worker parliament:report
      - name: Deploy mymp from the fresh copy
        if: github.event_name == 'schedule' && env.MYMP_DEPLOY_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MYMP_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/dispatches \
            -f event_type='sangsad-data-updated' \
            -f client_payload[ref]='prod' \
            -f client_payload[source]='sangsad-worker'
          echo 'mymp VPS deployment requested'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parliament-report
          path: sangsad/docs/reports
          if-no-files-found: ignore
          retention-days: 30
