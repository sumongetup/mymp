name: Sangsad worker

# Nightly refresh of the সংসদ engine behind mymp.bd from parliament.gov.bd,
# and on demand. Runs the three parliament jobs in order; each records itself
# in ingest_runs. Reads the repository secrets SANGSAD_DATABASE_URL,
# SANGSAD_SUPABASE_URL and SANGSAD_SUPABASE_SERVICE_ROLE_KEY, falling back to
# the older names they had before the rename, so the run never breaks while
# the owner moves them.

on:
  schedule:
    - cron: '0 20 * * *' # 02:00 Dhaka
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (parliament, parliament:photos, parliament:report, health)'
        default: parliament
        required: true

defaults:
  run:
    working-directory: sangsad

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.SANGSAD_DATABASE_URL || secrets.DURBIN_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SANGSAD_SUPABASE_URL || secrets.DURBIN_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANGSAD_SUPABASE_SERVICE_ROLE_KEY || secrets.DURBIN_SUPABASE_SERVICE_ROLE_KEY }}
      APP_ENV: production
      # Optional: mymp.bd's Vercel deploy hook, so the site rebuilds from tonight's copy right away.
      MYMP_DEPLOY_HOOK_URL: ${{ secrets.MYMP_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sangsad/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run on demand
        if: github.event_name == 'workflow_dispatch'
        run: pnpm worker ${{ github.event.inputs.job }}
      - name: Nightly refresh
        if: github.event_name == 'schedule'
        run: |
          pnpm worker parliament
          pnpm worker parliament:photos
          pnpm worker parliament:report
      - name: Rebuild mymp.bd from the fresh copy
        if: github.event_name == 'schedule' && env.MYMP_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$MYMP_DEPLOY_HOOK_URL" > /dev/null && echo 'mymp.bd rebuild requested'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parliament-report
          path: sangsad/docs/reports
          if-no-files-found: ignore
          retention-days: 30
