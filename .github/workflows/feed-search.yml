name: MP search collector

# Once an hour, asks mymp.bd to search the outlets that publish no usable feed
# (যুগান্তর, কালের কণ্ঠ, বাংলাদেশ প্রতিদিন, মানবজমিন, bdnews24, সময়, কালবেলা,
# বাংলানিউজ২৪, নয়া দিগন্ত, যমুনা) for four members' names.
#
# Google Programmable Search allows 100 free queries a day, so four an hour is
# 96 and the House comes round every three and a half days.
#
# Needs MYMP_CRON_SECRET here and FEED_SEARCH_KEY (with FEED_SEARCH_PROVIDER,
# and FEED_SEARCH_CX for Google) in Vercel. Without the key the run records
# itself as skipped and this job stays green.

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search for members in the outlets with no feed
        env:
          CRON_SECRET: ${{ secrets.MYMP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The MYMP_CRON_SECRET repository secret is not set."; exit 1; fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mymp.bd/api/cron/feed?collector=search&trigger=github")
          cat result.json; echo
          test "$code" = "200"
