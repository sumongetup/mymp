name: MP feed sitemap collector

# Every 30 minutes, asks mymp.bd to read the news sitemaps the outlets publish
# for search engines (config/news-sources.ts, runSitemapCollector in
# src/lib/feed/collect.ts). A feed carries an outlet's top twenty stories; its
# sitemap carries everything it has filed that day, which is where an ordinary
# member's name appears. Each run reads a slice of the outlets, so every one of
# them is read about once an hour and no newsroom's server is asked twice in the
# same breath.
#
# Needs the repository secret MYMP_CRON_SECRET, the same value as CRON_SECRET
# in Vercel. A failed run turns red here and GitHub emails the owner.

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-sitemap
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the outlets' news sitemaps
        env:
          CRON_SECRET: ${{ secrets.MYMP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The MYMP_CRON_SECRET repository secret is not set."; exit 1; fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mymp.bd/api/cron/feed?collector=sitemap&trigger=github")
          cat result.json; echo
          test "$code" = "200"
