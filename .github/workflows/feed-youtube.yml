name: MP video collector

# Once an hour, asks mymp.bd to look for videos of four members
# (src/lib/feed/collectors.ts). A YouTube search costs 100 of the 10,000 units
# a default key gets in a day, so four an hour is 9,600 a day and the whole
# House comes round in about three and a half days; members holding a
# government or House post come round twice as often.
#
# Needs MYMP_CRON_SECRET here and YOUTUBE_API_KEY in Vercel. Without the
# YouTube key the run records itself as skipped and this job stays green.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-youtube
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect videos for mymp.bd
        env:
          CRON_SECRET: ${{ secrets.MYMP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The MYMP_CRON_SECRET repository secret is not set."; exit 1; fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mymp.bd/api/cron/feed?collector=youtube&trigger=github")
          cat result.json; echo
          test "$code" = "200"
