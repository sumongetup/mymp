name: MP posts sync

# Every six hours, asks mymp.bd to re-read the cabinet and parliament lists
# and update ministers, state ministers, deputy ministers, advisers and House
# offices. GitHub Actions is the sole production scheduler for this job.
#
# Needs the repository secret MYMP_CRON_SECRET, the same value as CRON_SECRET
# in the VPS runtime environment. A failed run turns red here.

on:
  schedule:
    - cron: '40 */6 * * *' # 00:40, 06:40, 12:40, 18:40 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the posts sync on mymp.bd
        env:
          CRON_SECRET: ${{ secrets.MYMP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The MYMP_CRON_SECRET repository secret is not set."; exit 1; fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mymp.bd/api/cron/sync-posts?trigger=github")
          cat result.json; echo
          test "$code" = "200"
