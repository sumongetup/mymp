name: Durbin Sangsad worker

# Nightly refresh from parliament.gov.bd, and on demand. Runs the three
# parliament jobs in order; each records itself in ingest_runs. Needs the
# repository secrets DURBIN_DATABASE_URL, DURBIN_SUPABASE_URL and
# DURBIN_SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 20 * * *' # 02:00 Dhaka
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (parliament, parliament:photos, parliament:report, health)'
        default: parliament
        required: true

defaults:
  run:
    working-directory: durbin-sangsad

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DURBIN_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DURBIN_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DURBIN_SUPABASE_SERVICE_ROLE_KEY }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: durbin-sangsad/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run on demand
        if: github.event_name == 'workflow_dispatch'
        run: pnpm worker ${{ github.event.inputs.job }}
      - name: Nightly refresh
        if: github.event_name == 'schedule'
        run: |
          pnpm worker parliament
          pnpm worker parliament:photos
          pnpm worker parliament:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parliament-report
          path: durbin-sangsad/docs/reports
          if-no-files-found: ignore
          retention-days: 30
