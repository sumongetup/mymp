name: Feed source probe

# Asks every configured news feed and sitemap once from a GitHub runner and
# commits the answers to docs/feed/probe-github-actions.json. Several outlets
# refuse Vercel's addresses; this shows whether they refuse GitHub's too, which
# decides where the collectors should run. Runs when this file or the probe
# changes, or by hand.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/feed-probe.yml
      - scripts/probe-outlets.mjs
      - scripts/probe-outlets.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask every source once
        run: node scripts/probe-outlets.mjs
      - name: Commit the answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed/probe-github-actions.json
          git commit -m "chore(feed): source probe from a GitHub runner [skip ci]" || echo "nothing to commit"
          git pull --rebase
          git push
