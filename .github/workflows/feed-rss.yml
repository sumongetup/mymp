name: MP feed collector

# Every 30 minutes, asks mymp.bd to read the configured news feeds and attach
# what they carry to the members each story names (config/news-sources.ts,
# src/lib/feed/collect.ts). The schedule lives here because Vercel's Hobby plan
# allows only daily cron jobs; vercel.json keeps a daily run as a backstop.
#
# Needs the repository secret MYMP_CRON_SECRET, the same value as CRON_SECRET
# in Vercel. A failed run turns red here and GitHub emails the owner.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect news for mymp.bd
        env:
          CRON_SECRET: ${{ secrets.MYMP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The MYMP_CRON_SECRET repository secret is not set."; exit 1; fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mymp.bd/api/cron/feed?trigger=github")
          cat result.json; echo
          test "$code" = "200"

