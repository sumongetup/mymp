services:
  web:
    image: mymp:latest
    container_name: mymp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:3000"
    networks:
      - caddy_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  caddy_net:
    external: true
    name: caddy_net
